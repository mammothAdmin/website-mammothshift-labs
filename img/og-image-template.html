<!DOCTYPE html>
<!--
  OG Image Template | MammothShift Labs
  -------------------------------------------------------------------
  This file is a design template for generating the social sharing image
  (og:image). It is NOT a page of the website.

  TO GENERATE og-image.png:
  1. Open this file in Chrome or Edge
  2. Open DevTools -> toggle device toolbar (Ctrl+Shift+M)
  3. Set dimensions to exactly 1200 x 630
  4. Screenshot the page (DevTools -> ... -> Capture screenshot)
  5. Save the output as img/og-image.png
  -------------------------------------------------------------------
-->
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1200">
  <title>OG Image Template</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      width: 1200px; height: 630px; overflow: hidden;
      font-family: 'Inter', sans-serif;
      background: #0a1628;
      color: #f8fafc;
      -webkit-font-smoothing: antialiased;
    }

    .bg {
      position: absolute; inset: 0;
      background:
        radial-gradient(ellipse 600px 400px at 20% 30%, rgba(24,185,217,0.12) 0%, transparent 60%),
        radial-gradient(ellipse 500px 350px at 80% 70%, rgba(139,92,246,0.08) 0%, transparent 60%);
    }

    .grid {
      position: absolute; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 60px 60px;
    }

    .content {
      position: relative; z-index: 1;
      height: 100%; display: flex; flex-direction: column;
      padding: 52px 64px 48px;
    }

    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: auto;
    }

    .brand {
      display: flex; align-items: center; gap: 14px;
    }

    .brand-icon {
      width: 44px; height: 44px;
    }

    .brand-name {
      font-size: 22px; font-weight: 800; letter-spacing: -0.02em;
    }

    .brand-tag {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.22em; color: #18b9d9;
      background: rgba(24,185,217,0.1); border: 1px solid rgba(24,185,217,0.25);
      border-radius: 100px; padding: 5px 16px;
    }

    .main { padding-bottom: 0; }

    .eyebrow {
      font-size: 13px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.2em; color: #18b9d9; margin-bottom: 18px;
      display: flex; align-items: center; gap: 10px;
    }
    .eyebrow::before {
      content: ''; display: block;
      width: 32px; height: 2px;
      background: linear-gradient(90deg, #18b9d9, #8b5cf6);
      border-radius: 1px;
    }

    .headline {
      font-size: 64px; font-weight: 800;
      letter-spacing: -0.04em; line-height: 1.05;
      margin-bottom: 20px;
    }

    .headline .grad {
      background: linear-gradient(135deg, #18b9d9 0%, #8b5cf6 55%, #d946ef 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .tagline {
      font-size: 20px; font-weight: 400; color: #94a3b8;
      letter-spacing: -0.01em; line-height: 1.5;
    }

    .bottombar {
      display: flex; align-items: center; justify-content: space-between;
      padding-top: 28px;
      border-top: 1px solid rgba(255,255,255,0.08);
      margin-top: 32px;
    }

    .url { font-size: 15px; font-weight: 600; color: #475569; letter-spacing: 0.01em; }

    .pills { display: flex; gap: 10px; }
    .pill {
      font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
      padding: 5px 14px; border-radius: 100px;
      background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
      color: #64748b;
    }
  </style>
</head>
<body>

  <div class="bg"></div>
  <div class="grid"></div>

  <div class="content">

    <div class="topbar">
      <div class="brand">
        <svg class="brand-icon" viewBox="0 0 48 48" fill="none">
          <polygon points="24,4 42,13 42,35 24,44 6,35 6,13" fill="none" stroke="#18b9d9" stroke-width="2"/>
          <circle cx="24" cy="24" r="6" fill="#18b9d9"/>
        </svg>
        <div class="brand-name">MammothShift Labs</div>
      </div>
      <div class="brand-tag">Legal Operations Software</div>
    </div>

    <div class="main">
      <div class="eyebrow">Software That Powers Legal Services</div>
      <h1 class="headline">
        Build. Support.<br>
        <span class="grad">Scale.</span>
      </h1>
      <p class="tagline">Platforms for law firms and legal service companies.</p>
    </div>

    <div class="bottombar">
      <div class="url">mammothshift-labs.com</div>
      <div class="pills">
        <div class="pill">LawFabric</div>
        <div class="pill">ClientGuard360</div>
        <div class="pill">MammothShift</div>
        <div class="pill">ProformConnect</div>
      </div>
    </div>

  </div>

</body>
</html>
